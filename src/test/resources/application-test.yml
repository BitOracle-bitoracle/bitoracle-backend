spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password : ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop # 테스트니까 create-drop 추천 (매 테스트마다 테이블 생성/삭제)
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # 테스트 DB라면 이런 옵션도 있어
  sql:
    init:
      mode: always