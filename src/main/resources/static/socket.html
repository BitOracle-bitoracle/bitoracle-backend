<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>포트폴리오 WebSocket 테스트</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>
<h2>WebSocket 포트폴리오 수신 테스트</h2>

<label for="jwtToken">🔐 JWT 토큰:</label><br>
<input type="text" id="jwtToken" style="width: 600px;" placeholder="여기에 Bearer 토큰 입력" />
<button onclick="connect()">🔗 연결</button>
<button onclick="disconnect()">🔌 연결 종료</button>

<pre id="output">⏳ 대기 중...</pre>

<script>
    let stompClient = null;
    let socket = null;

    function connect() {
        const token = document.getElementById("jwtToken").value.trim();
        if (!token) {
            alert("JWT 토큰을 입력하세요.");
            return;
        }

        const socket = new SockJS("http://localhost:8080/ws-portfolio", null, {
            transports: ['websocket', 'xhr-streaming']  // ← jsonp 제외
        });
        stompClient = Stomp.over(socket);

        const headers = {
            Authorization: "Bearer " + token
        };

        stompClient.connect(headers, function (frame) {
            document.getElementById("output").innerText += "\n✅ 연결됨: " + frame;

            stompClient.subscribe("/user/queue/portfolio", function (message) {
                const portfolios = JSON.parse(message.body);
                document.getElementById("output").innerText += "\n📩 수신된 포트폴리오:\n" + JSON.stringify(portfolios, null, 2);
            });

        }, function (error) {
            document.getElementById("output").innerText += "\n❌ 연결 실패: " + error;
        });
    }

    function disconnect() {
        if (stompClient && stompClient.connected) {
            stompClient.disconnect(function () {
                document.getElementById("output").innerText += "\n🔌 연결 종료됨.";
            });
        }
    }
</script>
</body>
</html>
