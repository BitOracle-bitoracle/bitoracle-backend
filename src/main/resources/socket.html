<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>포트폴리오 WebSocket 테스트</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>
<h2>WebSocket 포트폴리오 수신 테스트</h2>

<label for="token">Access Token (JWT):</label><br>
<input type="text" id="token" style="width: 600px;" placeholder="JWT 토큰을 입력하세요" /><br><br>

<button onclick="setTokenAndConnect()">Connect</button>
<button onclick="disconnect()">Disconnect</button>

<pre id="output">⏳ 준비 중...</pre>

<script>
    let stompClient = null;
    let socket = null;

    function setTokenAndConnect() {
        const token = document.getElementById("token").value.trim();
        if (!token) {
            alert("토큰을 입력하세요!");
            return;
        }

        socket = new SockJS("http://localhost:8080/ws-portfolio");
        stompClient = Stomp.over(socket);

        // 헤더에 Authorization 추가
        const headers = {
            Authorization: "Bearer " + token
        };

        stompClient.connect(headers, function (frame) {
            document.getElementById("output").innerText += "\n✅ 연결됨: " + frame;

            stompClient.subscribe("/user/queue/portfolio", function (message) {
                document.getElementById("output").innerText += "\n📩 메시지 수신:\n" + message.body;
            });
        }, function (error) {
            document.getElementById("output").innerText += "\n❌ 연결 실패: " + error;
        });
    }

    function disconnect() {
        if (stompClient && stompClient.connected) {
            stompClient.disconnect(() => {
                document.getElementById("output").innerText += "\n🛑 연결 해제됨";
            });
            stompClient = null;
            socket = null;
        } else {
            document.getElementById("output").innerText += "\n⚠️ 연결된 WebSocket이 없습니다.";
        }
    }
</script>
</body>
</html>
